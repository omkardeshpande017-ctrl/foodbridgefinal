server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers for the HTML shell. The API sets its own headers.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Long-lived immutable assets produced by Vite (hashed file names).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The API lives behind the same origin, so the browser never needs a second
  # hostname and there is no CORS involved at all. `api` is the compose service
  # name; inside a tunnel or on a public host it is still resolved by Docker DNS.
  location /api/ {
    proxy_pass http://api:5001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # SPA fallback so React Router deep links (/login, /donations/:id …) resolve.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
